[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "home-observer"
version = "0.1.0"
description = "A replayable multimodal home observer with Runpod training and inference"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pillow>=11,<13", "numpy>=2,<3", "soundfile>=0.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
data = ["huggingface-hub>=0.34", "datasets>=4", "imageio-ffmpeg>=0.6"]
sensing = ["opencv-contrib-python-headless>=4.11,<5"]

[project.scripts]
home-observer = "home_observer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/home_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
